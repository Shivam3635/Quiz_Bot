[project]
name = "quizbotpro"
version = "0.1.0"
description = "QuizBotPro Telegram Quiz Poll Creator Bot - One paste. One setup. Hundreds of quizzes."
authors = [{ name = "QuizBotPro Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "certifi>=2026.10.18",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pypdf>=6.21.4",
    "google-genai>=2.0.0",
    "pillow>=13.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::telegram.warnings.PTBUserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "scratch",
]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | scratch
)/
'''
