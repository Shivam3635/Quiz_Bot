[project]
name = "bulkquiz"
version = "0.1.0"
description = "Bulk Telegram Quiz Poll Creator Bot - One paste. One setup. Hundreds of quizzes."
authors = [{ name = "BulkQuiz Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::telegram.warnings.PTBUserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
