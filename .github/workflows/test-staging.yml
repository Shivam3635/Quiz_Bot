name: Staging Isolation & Async Tests

on:
  workflow_dispatch:

  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Execute Staging & Async Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ENVIRONMENT: testing
      TELEGRAM_BOT_TOKEN: "123456:mock_token_for_ci_testing_only"
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify and install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Security guard (verify no .env file exists)
        run: |
          if [ -f .env ]; then
            echo "ERROR: Security violation! A .env file was detected in the workspace root."
            echo "CI test runs must never contain or load real .env credential files."
            exit 1
          fi
          echo "Security check passed: No .env file present in workspace root."

      - name: Step 1 - Run Staging Authorization & Async Tests (pytest-asyncio)
        # Executes all 26 tests in tests/test_staging_auth.py, including all 13 @pytest.mark.asyncio tests
        # using Python's native event loop in Linux where loopback socket pairing is unrestricted.
        run: |
          pytest tests/test_staging_auth.py -vv --tb=short

      - name: Step 2 - Run Database Isolation Tests
        # Executes all 36 tests in tests/test_database_isolation.py independently, verifying strict
        # TLS parameters, hostname verification, fail-closed handling, and atomic rollback semantics.
        run: |
          pytest tests/test_database_isolation.py -vv --tb=short

      - name: Step 3 - Run Complete Repository Test Suite
        # Executes all test suites across the repository with in-memory test database isolation.
        run: |
          pytest -q --tb=short
